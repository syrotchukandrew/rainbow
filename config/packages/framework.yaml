parameters:
    locale: uk
    app_locales: uk|en

framework:
    translator:
        fallbacks: ["%locale%"]
    secret:          "%secret%"
    mailer:
        dsn: "%mailer_dsn%"
    router:
        strict_requirements: ~
    assets:          ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_attributes: true }
    default_locale:  "%locale%"
    trusted_hosts:   ~
    session:
        storage_factory_id: session.storage.factory.native
    fragments:       ~