hwi_oauth_redirect:
    resource: "@HWIOAuthBundle/Resources/config/routing/redirect.xml"
    prefix:   /connect

hwi_oauth_login:
    resource: "@HWIOAuthBundle/Resources/config/routing/login.xml"
    prefix:   /login-social

facebook_login:
    path: /login/check-facebook

google_login:
    path: /login/check-google

vkontakte_login:
    path: /login/check-vkontakte

logout:
    path: /logout

app_admin:
    resource: '../src/App/Controller/Admin/'
    type:     attribute

app_api:
    resource: '../src/App/Controller/Api/'
    type:     attribute

app:
    resource: '../src/App/Controller/'
    type:     attribute
    prefix:   /{_locale}
    requirements:
        _locale: "%app_locales%"
    defaults:
        _locale: "%locale%"
    exclude:
        - '../src/App/Controller/Admin/'
        - '../src/App/Controller/Api/'


homepage:
    path:     /{_locale}
    defaults: { _controller: App\Controller\SiteController::indexAction, _locale: uk }
    requirements:
        _locale: uk|en

_liip_imagine:
    resource: "@LiipImagineBundle/Resources/config/routing.yaml"

fos_js_routing:
    resource: "@FOSJsRoutingBundle/Resources/config/routing/routing-sf4.xml"
